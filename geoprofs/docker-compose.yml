# Optional: gives everyone on the team an identical MySQL instance without
# installing MySQL locally. Run: docker compose up -d
# Then point backend/.env at DB_HOST=127.0.0.1, DB_PORT=3306, DB_DATABASE=geoprofs,
# DB_USERNAME=geoprofs, DB_PASSWORD=secret (matching below).

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: geoprofs
      MYSQL_USER: geoprofs
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - geoprofs_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  geoprofs_mysql_data:
